<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyers 單字練習 - 完整版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p { font-size: 1.1rem; opacity: 0.9; }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat-item { text-align: center; color: white; }
        .stat-num { font-size: 2rem; font-weight: bold; }
        .stat-label { font-size: 0.9rem; opacity: 0.8; }
        
        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .mode-tab {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.2);
            color: white;
            font-weight: 600;
        }
        
        .mode-tab:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .mode-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Flashcard Styles */
        .flashcard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .flashcard {
            width: 420px;
            height: 380px;
            perspective: 1000px;
            cursor: pointer;
        }
        
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .flashcard-front { background: white; }
        
        .flashcard-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }
        
        .flashcard .word {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .flashcard .pos {
            font-size: 1rem;
            color: #666;
            font-style: italic;
        }
        
        .flashcard-back .pos { color: rgba(255,255,255,0.8); }
        .flashcard .chinese { font-size: 1.3rem; margin-top: 8px; }
        
        .flashcard-image {
            width: 100%;
            max-width: 180px;
            height: 120px;
            object-fit: contain;
            border-radius: 12px;
            margin: 12px 0;
            background: #f5f5f5;
            padding: 5px;
        }
        
        .image-loading {
            color: #999;
            font-size: 0.9rem;
            margin: 12px 0;
        }
        
        .image-error {
            color: #ccc;
            font-size: 0.85rem;
            margin: 12px 0;
        }
        
        .speak-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        
        .speak-btn:hover { transform: scale(1.2); }
        
        .flashcard-controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .control-btn.primary { background: white; color: #667eea; }
        .control-btn.secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s;
        }
        
        .progress-text { color: white; font-size: 0.95rem; }
        
        /* Filter Section */
        .filter-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .filter-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .letter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .letter-btn {
            width: 45px;
            height: 45px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .letter-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .letter-btn.selected {
            background: #667eea;
            color: white;
        }
        
        .letter-count {
            font-size: 0.7rem;
            display: block;
            margin-top: -2px;
        }
        
        .filter-info {
            text-align: center;
            color: #666;
            margin-top: 15px;
            font-size: 0.95rem;
        }
        
        /* Quiz Styles */
        .quiz-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .quiz-score {
            font-size: 1.3rem;
            color: #667eea;
            font-weight: bold;
        }
        
        .quiz-question {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .quiz-question-num {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .quiz-chinese-hint {
            text-align: center;
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 25px;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            border: 2px solid #667eea;
        }
        
        .quiz-input-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .letter-box {
            width: 50px;
            height: 55px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.5rem;
            text-align: center;
            text-transform: lowercase;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .letter-box:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .letter-box.correct {
            border-color: #28a745;
            background: #d4edda;
            color: #28a745;
        }
        
        .letter-box.wrong {
            border-color: #dc3545;
            background: #f8d7da;
            color: #dc3545;
        }
        
        .letter-box.hint {
            border-color: #ffc107;
            background: #fff3cd;
        }
        
        .quiz-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .quiz-btn {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .quiz-btn.check { background: #667eea; color: white; }
        .quiz-btn.next { background: #28a745; color: white; }
        .quiz-btn.restart { background: #6c757d; color: white; }
        .quiz-btn.hint { background: #ffc107; color: #333; }
        
        .quiz-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .quiz-result {
            text-align: center;
            padding: 40px;
        }
        
        .quiz-result h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }
        
        .quiz-result-score {
            font-size: 4rem;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .quiz-result-message {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
        }
        
        /* Word List */
        .word-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .word-item {
            background: white;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .word-item:hover { transform: translateY(-2px); }
        .word-info { flex: 1; }
        .word-info .num { color: #999; font-size: 0.8rem; }
        .word-info .english { font-weight: bold; color: #333; font-size: 1.05rem; }
        .word-info .chinese { color: #666; font-size: 0.9rem; margin-top: 4px; }
        
        .word-speak {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .word-speak:hover { opacity: 1; }
        
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-bar input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
        }
        
        .filter-bar input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .flashcard { width: 340px; height: 360px; }
            .flashcard .word { font-size: 1.7rem; }
            .flashcard-image { max-width: 140px; height: 100px; }
            .letter-box { width: 40px; height: 45px; font-size: 1.2rem; }
            .letter-btn { width: 38px; height: 38px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Flyers 單字練習</h1>
            <p>劍橋兒童英語認證 Flyers 完整單字表 | 540個核心單字</p>
        </header>
        
        <div class="stats">

                <div class="stat-num">540</div>

                <div class="stat-label">已學習</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="quiz-score">0</div>
                <div class="stat-label">測驗得分</div>
            </div>
        </div>
        
        <div class="mode-tabs">
            <button class="mode-tab active" onclick="switchMode('flashcard')">📇 單字卡</button>
            <button class="mode-tab" onclick="switchMode('quiz')">📝 填空測驗</button>
            <button class="mode-tab" onclick="switchMode('list')">📋 單字列表</button>
        </div>
        
        <!-- Flashcard Section -->
        <div id="flashcard-section" class="section active">
            <div class="flashcard-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="flashcard-progress"></div>
                </div>
                <div class="progress-text" id="flashcard-progress-text">1 / 540</div>
                
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <div class="word" id="card-word">a.m.</div>
                            <div class="pos" id="card-pos">adv.</div>
                            <div id="card-image-container" class="image-loading">🔄 載入圖片中...</div>
                            <button class="speak-btn" id="speak-en-btn" onclick="event.stopPropagation(); speakCurrentEn()">🔊 英</button>
                        </div>
                        <div class="flashcard-back">
                            <div class="word" id="card-word-back">a.m.</div>
                            <div class="pos" id="card-pos-back">adv.</div>
                            <div id="card-image-container-back" class="image-loading">🔄 載入圖片中...</div>
                            <div class="chinese" id="card-chinese">上午</div>
                            <button class="speak-btn" id="speak-zh-btn" onclick="event.stopPropagation(); speakCurrentZh()">🔊 中</button>
                        </div>
                    </div>
                </div>
                
                <div class="flashcard-controls">
                    <button class="control-btn secondary" onclick="prevCard()">⬅️ 上一個</button>
                    <button class="control-btn primary" onclick="speakCurrent()">🔊 發音</button>
                    <button class="control-btn secondary" onclick="nextCard()">下一個 ➡️</button>
                </div>
                <div class="flashcard-controls">
                    <button class="control-btn secondary" onclick="shuffleCards()">🔀 隨機排序</button>
                    <button class="control-btn secondary" onclick="resetCards()">🔄 重置進度</button>
                </div>
            </div>
        </div>
        
        <!-- Quiz Section -->
        <div id="quiz-section" class="section">
            <div class="filter-section">
                <div class="filter-title">🎯 選擇要測驗的字母開頭的單字</div>
                <div class="letter-grid" id="letter-grid"></div>
                <div class="filter-info" id="filter-info">請選擇字母後開始測驗</div>
            </div>
            
            <div class="quiz-container" id="quiz-container" style="display: none;">
                <div class="quiz-header">
                    <div class="quiz-score">得分: <span id="current-score">0</span> / <span id="total-questions">10</span></div>
                </div>
                <div id="quiz-content"></div>
                <div class="quiz-actions" id="quiz-actions"></div>
            </div>
        </div>
        
        <!-- Word List Section -->
        <div id="list-section" class="section">
            <div class="filter-bar">
                <input type="text" id="search-input" placeholder="搜尋單字（英文或中文）..." oninput="filterWords()">
            </div>
            <div class="word-list" id="word-list"></div>
        </div>
    </div>

        let currentIndex = 0;
        let shuffledVocab = [...vocabulary];
        let selectedLetters = [];
        let quizQuestions = [];
        let currentQuestion = 0;
        let score = 0;
        let learnedWords = new Set();
        let hintUsed = false;

        // Text-to-Speech
        function speak(text, lang = 'en') {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85;
                speechSynthesis.speak(utterance);
            }
        }

        function speakCurrent() {
            const word = shuffledVocab[currentIndex].word;
            speak(word, 'en');
        }

        function speakCurrentEn() {
            const word = shuffledVocab[currentIndex].word;
            speak(word, 'en');
        }

        function speakCurrentZh() {
            const chinese = shuffledVocab[currentIndex].chinese;
            speak(chinese, 'zh-TW');
        }

        // 圖片快取
        const imageCache = {};

        // 獲取單字圖片
        async function getWordImage(word) {
            // 如果已經快取過，直接返回
            if (imageCache[word]) {
                return imageCache[word];
            }
            
            // 使用 Wikimedia Commons API 搜尋圖片
            const searchTerms = [
                word.toLowerCase(),
                word.toLowerCase().replace(/[^a-z]/g, ''),
                word.toLowerCase().split(' ')[0]
            ];
            
            for (const term of searchTerms) {
                try {
                    const url = `https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(term)}&srnamespace=6&srlimit=3&format=json&origin=*`;
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data.query && data.query.search && data.query.search.length > 0) {
                        for (const result of data.query.search) {
                            const title = result.title;
                            // 獲取圖片 URL
                            const imageInfoUrl = `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=imageinfo&iiprop=url&format=json&origin=*`;
                            const imageInfoResponse = await fetch(imageInfoUrl);
                            const imageInfoData = await imageInfoResponse.json();
                            
                            const pages = imageInfoData.query.pages;
                            for (const pageId in pages) {
                                if (pages[pageId].imageinfo && pages[pageId].imageinfo[0]) {
                                    const imageUrl = pages[pageId].imageinfo[0].url;
                                    // 檢查是否是圖片格式
                                    if (imageUrl.match(/\.(jpg|jpeg|png|gif|svg|webp)$/i)) {
                                        imageCache[word] = imageUrl;
                                        return imageUrl;
                                    }
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.log('Image fetch error:', error);
                }
            }
            
            // 如果找不到，返回 null
            imageCache[word] = null;
            return null;
        }

        // 載入圖片到卡片
        async function loadCardImage(word) {
            const containerFront = document.getElementById('card-image-container');
            const containerBack = document.getElementById('card-image-container-back');
            
            // 顯示載入中
            containerFront.className = 'image-loading';
            containerFront.innerHTML = '🔄 載入圖片中...';
            containerBack.className = 'image-loading';
            containerBack.innerHTML = '🔄 載入圖片中...';
            
            try {
                const imageUrl = await getWordImage(word);
                
                if (imageUrl) {
                    containerFront.className = '';
                    containerFront.innerHTML = `<img src="${imageUrl}" alt="${word}" class="flashcard-image" onerror="this.style.display='none';this.parentElement.innerHTML='⚠️ 圖片載入失敗'" onload="this.style.opacity='1'" style="opacity:0;transition:opacity 0.3s;">`;
                    
                    containerBack.className = '';
                    containerBack.innerHTML = `<img src="${imageUrl}" alt="${word}" class="flashcard-image" style="background:rgba(255,255,255,0.9);">`;
                } else {
                    containerFront.className = 'image-error';
                    containerFront.innerHTML = '📷 暫無圖片';
                    containerBack.className = 'image-error';
                    containerBack.innerHTML = '📷 暫無圖片';
                }
            } catch (error) {
                containerFront.className = 'image-error';
                containerFront.innerHTML = '📷 暫無圖片';
                containerBack.className = 'image-error';
                containerBack.innerHTML = '📷 暫無圖片';
            }
        }

        // Flashcard Functions
        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function updateCard() {
            const card = shuffledVocab[currentIndex];
            document.getElementById('card-word').textContent = card.word;
            document.getElementById('card-word-back').textContent = card.word;
            document.getElementById('card-pos').textContent = card.pos;
            document.getElementById('card-pos-back').textContent = card.pos;
            document.getElementById('card-chinese').textContent = card.chinese;
            document.getElementById('flashcard').classList.remove('flipped');
            
            // 載入圖片
            loadCardImage(card.word);
            
            const progress = ((currentIndex + 1) / shuffledVocab.length) * 100;
            document.getElementById('flashcard-progress').style.width = progress + '%';
            document.getElementById('flashcard-progress-text').textContent = `${currentIndex + 1} / ${shuffledVocab.length}`;
            
            learnedWords.add(card.num);
            document.getElementById('learned-count').textContent = learnedWords.size;
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % shuffledVocab.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + shuffledVocab.length) % shuffledVocab.length;
            updateCard();
        }

        function shuffleCards() {
            shuffledVocab = [...vocabulary].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            updateCard();
        }

        function resetCards() {
            shuffledVocab = [...vocabulary];
            currentIndex = 0;
            learnedWords.clear();
            document.getElementById('learned-count').textContent = 0;
            updateCard();
        }

        // Mode Switching
        function switchMode(mode) {
            document.querySelectorAll('.mode-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(mode + '-section').classList.add('active');
            
            if (mode === 'quiz') {
                initLetterGrid();
            } else if (mode === 'list') {
                showWordList();
            }
        }

        // Quiz Letter Selection
        function initLetterGrid() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            const grid = document.getElementById('letter-grid');
            
            grid.innerHTML = letters.map(letter => {
                const count = vocabulary.filter(w => w.word.charAt(0).toUpperCase() === letter).length;
                return `<button class="letter-btn" data-letter="${letter}" onclick="toggleLetter('${letter}')">
                    ${letter}
                    ${count > 0 ? `<span class="letter-count">(${count})</span>` : ''}
                </button>`;
            }).join('');
            
            updateFilterInfo();
        }

        function toggleLetter(letter) {
            const btn = document.querySelector(`[data-letter="${letter}"]`);
            if (selectedLetters.includes(letter)) {
                selectedLetters = selectedLetters.filter(l => l !== letter);
                btn.classList.remove('selected');
            } else {
                selectedLetters.push(letter);
                btn.classList.add('selected');
            }
            updateFilterInfo();
        }

        function updateFilterInfo() {
            const info = document.getElementById('filter-info');
            if (selectedLetters.length === 0) {
                info.innerHTML = '請選擇字母後點擊「開始測驗」';
                info.innerHTML += '<br><button class="control-btn primary" style="margin-top:15px" onclick="startQuiz()">🎯 開始測驗</button>';
            } else {
                let total = 0;
                selectedLetters.forEach(l => {
                    total += vocabulary.filter(w => w.word.charAt(0).toUpperCase() === l).length;
                });
                info.innerHTML = `已選擇 ${selectedLetters.length} 個字母，共 ${total} 個單字`;
                info.innerHTML += '<br><button class="control-btn primary" style="margin-top:15px" onclick="startQuiz()">🎯 開始測驗</button>';
            }
        }

        // Quiz Functions
        function startQuiz() {
            if (selectedLetters.length === 0) {
                alert('請先選擇要測驗的字母！');
                return;
            }
            
            const filtered = vocabulary.filter(w => 
                selectedLetters.includes(w.word.charAt(0).toUpperCase())
            );
            
            quizQuestions = [...filtered].sort(() => Math.random() - 0.5).slice(0, Math.min(10, filtered.length));
            currentQuestion = 0;
            score = 0;
            hintUsed = false;
            
            document.getElementById('current-score').textContent = 0;
            document.getElementById('total-questions').textContent = quizQuestions.length;
            document.getElementById('quiz-container').style.display = 'block';
            
            showQuestion();
        }

        function showQuestion() {
            const q = quizQuestions[currentQuestion];
            const content = document.getElementById('quiz-content');
            const word = q.word.toLowerCase();
            
            content.innerHTML = `
                <div class="quiz-question">
                    <div class="quiz-question-num">題目 ${currentQuestion + 1} / ${quizQuestions.length}</div>
                    <div class="quiz-chinese-hint">
                        <span style="color:#667eea;font-weight:bold;">中文：</span>${q.chinese}
                        <button onclick="speak('${q.chinese}', 'zh-TW')" style="margin-left:10px;font-size:1.2rem;border:none;background:none;cursor:pointer;">🔊</button>
                    </div>
                    <div class="quiz-word-hint" style="text-align:center;color:#888;font-size:0.9rem;margin-bottom:15px;">
                        字母數：${word.length} 個字母
                    </div>
                    <div class="quiz-input-container" id="letter-inputs">
                        ${word.split('').map((char, i) => 
                            `<input type="text" class="letter-box" maxlength="1" data-index="${i}" data-char="${char}" 
                             onkeyup="handleKeyUp(event, ${i})" oninput="handleInput(event, ${i})">`
                        ).join('')}
                    </div>
                </div>
            `;
            
            document.getElementById('quiz-actions').innerHTML = `
                <button class="quiz-btn check" onclick="checkAnswer()">✓ 檢查答案</button>
                <button class="quiz-btn hint" onclick="showHint()">💡 提示一個字母</button>
            `;
            
            // Focus first input
            setTimeout(() => {
                const firstInput = document.querySelector('.letter-box');
                if (firstInput) firstInput.focus();
            }, 100);
        }

        function handleInput(e, index) {
            const value = e.target.value.toLowerCase();
            e.target.value = value;
        }

        function handleKeyUp(e, index) {
            const inputs = document.querySelectorAll('.letter-box');
            
            if (e.key === 'Backspace' && index > 0 && !e.target.value) {
                inputs[index - 1].focus();
            } else if (e.key !== 'Backspace' && e.key !== 'Enter' && index < inputs.length - 1) {
                if (e.target.value) {
                    inputs[index + 1].focus();
                }
            } else if (e.key === 'Enter') {
                checkAnswer();
            }
        }

        function showHint() {
            const inputs = document.querySelectorAll('.letter-box');
            const emptyInputs = [];
            
            inputs.forEach((input, i) => {
                if (!input.classList.contains('correct') && !input.value) {
                    emptyInputs.push({input, index: i});
                }
            });
            
            if (emptyInputs.length > 0) {
                const random = emptyInputs[Math.floor(Math.random() * emptyInputs.length)];
                const char = random.input.dataset.char;
                random.input.value = char;
                random.input.classList.add('hint');
                random.input.disabled = true;
                hintUsed = true;
            }
        }

        function checkAnswer() {
            const inputs = document.querySelectorAll('.letter-box');
            let allCorrect = true;
            const word = quizQuestions[currentQuestion].word;
            
            inputs.forEach(input => {
                const userChar = input.value.toLowerCase();
                const correctChar = input.dataset.char;
                
                if (userChar === correctChar) {
                    input.classList.add('correct');
                    input.disabled = true;
                } else {
                    input.classList.add('wrong');
                    input.value = correctChar;
                    input.disabled = true;
                    allCorrect = false;
                }
            });
            
            // 顯示正確答案並可發音
            const q = quizQuestions[currentQuestion];
            const resultDiv = document.createElement('div');
            resultDiv.style.cssText = 'text-align:center;margin-top:20px;padding:15px;background:#fff;border-radius:10px;';
            resultDiv.innerHTML = `
                <div style="font-size:1.5rem;font-weight:bold;color:${allCorrect ? '#28a745' : '#dc3545'};">
                    ${allCorrect ? '✓ 正確！' : '✗ 錯誤'}
                </div>
                <div style="font-size:1.3rem;margin-top:10px;color:#333;">
                    ${q.word} <button onclick="speak('${q.word}', 'en')" style="font-size:1.2rem;border:none;background:none;cursor:pointer;">🔊</button>
                </div>
            `;
            document.querySelector('.quiz-question').appendChild(resultDiv);
            
            if (allCorrect && !hintUsed) {
                score++;
                document.getElementById('current-score').textContent = score;
                // 答對自動播放發音
                speak(word, 'en');
            }
            
            document.getElementById('quiz-actions').innerHTML = `
                <button class="quiz-btn next" onclick="nextQuestion()">下一題 →</button>
            `;
        }

        function nextQuestion() {
            hintUsed = false;
            currentQuestion++;
            if (currentQuestion < quizQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const percentage = Math.round((score / quizQuestions.length) * 100);
            let message = '', emoji = '';
            
            if (percentage >= 90) { message = '太棒了！你已經掌握了這些單字！'; emoji = '🎉'; }
            else if (percentage >= 70) { message = '做得很好！繼續加油！'; emoji = '👍'; }
            else if (percentage >= 50) { message = '還不錯！多練習會更好！'; emoji = '💪'; }
            else { message = '需要多練習哦！加油！'; emoji = '📚'; }
            
            document.getElementById('quiz-content').innerHTML = `
                <div class="quiz-result">
                    <h2>${emoji} 測驗完成！</h2>
                    <div class="quiz-result-score">${score} / ${quizQuestions.length}</div>
                    <div class="quiz-result-message">${message}</div>
                </div>
            `;
            
            document.getElementById('quiz-actions').innerHTML = `
                <button class="quiz-btn restart" onclick="document.getElementById('quiz-container').style.display='none';selectedLetters=[];initLetterGrid();">🔄 再測一次</button>
            `;
            
            document.getElementById('quiz-score').textContent = score;
        }

        // Word List
        function showWordList() {
            const list = document.getElementById('word-list');
            list.innerHTML = vocabulary.map(word => `
                <div class="word-item">
                    <div class="word-info">
                        <div class="num">#${word.num}</div>
                        <div class="english">${word.word} <span style="color:#667eea;font-size:0.85rem">${word.pos}</span></div>
                        <div class="chinese">${word.chinese}</div>
                    </div>
                    <button class="word-speak" onclick="speak('${word.word}', 'en')">🔊</button>
                </div>
            `).join('');
        }

        function filterWords() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const list = document.getElementById('word-list');
            
            const filtered = vocabulary.filter(word => 
                word.word.toLowerCase().includes(search) || 
                word.chinese.includes(search)
            );
            
            list.innerHTML = filtered.map(word => `
                <div class="word-item">
                    <div class="word-info">
                        <div class="num">#${word.num}</div>
                        <div class="english">${word.word} <span style="color:#667eea;font-size:0.85rem">${word.pos}</span></div>
                        <div class="chinese">${word.chinese}</div>
                    </div>
                    <button class="word-speak" onclick="speak('${word.word}', 'en')">🔊</button>
                </div>
            `).join('');
        }

        // Initialize
        updateCard();
    </script>
